[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompttracir"
version = "0.1.0"
description = "Incident reconstruction and attribution for prompt-injection attacks on AI agents"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "duckdb>=0.10",
  "networkx>=3.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
]

[project.optional-dependencies]
evtx = ["python-evtx>=0.7"]
dev = ["pytest>=8"]

[project.scripts]
ptir = "prompttracir.cli:main"

[tool.setuptools.packages.find]
include = ["prompttracir*"]

[tool.setuptools.package-data]
prompttracir = ["web/*"]
